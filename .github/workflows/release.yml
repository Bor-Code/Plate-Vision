name: Release

"on":
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Validate, Changelog, and Publish Container Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv and dependency cache
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run quality gates
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src tests
          uv run pytest

      - name: Verify semantic version tag and generate changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run python -c "import os, subprocess; from pathlib import Path; from plate_vision import __version__; from plate_vision.utils.release import generate_changelog_markdown, validate_release_tag; tag = os.environ['RELEASE_TAG']; validate_release_tag(tag, __version__); log_out = subprocess.check_output(['git', 'log', '--pretty=format:%s'], text=True); Path('RELEASE_NOTES.md').write_text(generate_changelog_markdown(tag, log_out.splitlines()), encoding='utf-8')"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract container metadata and semantic tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push multi-stage container image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes-file RELEASE_NOTES.md
